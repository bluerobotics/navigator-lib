[package]
name = "bluerobotics_navigator"
version = "0.2.0"
edition = "2021"
build = "src/build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
cpy-binder = "1.0"
libc = "0.2"
pyo3 = { version = "0.18", features = ["extension-module", "abi3-py39"], optional = true }
navigator-rs = { version = "0.7.0" }
# 0.7.8 drops basepri on ARM Linux when HOST != TARGET
cortex-m = "=0.7.7"
rand = "0.8"
lazy_static = "1.4.0"

[build-dependencies]
cbindgen = "0.24"

[features]
python = ["pyo3"]
